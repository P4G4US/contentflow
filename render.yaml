services:
  - type: web
    name: contentflow
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: contentflow-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: MAX_UPLOAD_MB
        value: "250"
      - key: PORT
        value: "8000"