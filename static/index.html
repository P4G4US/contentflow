<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContentFlow — Review & publish</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2939;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#4758d3;text-decoration:none}.layout{min-height:100vh;display:flex}.sidebar{width:242px;background:#141b2d;color:#cad2e2;padding:28px 18px;flex-shrink:0}.logo{font-size:23px;font-weight:850;letter-spacing:-1px;color:#fff;margin:0 14px 40px}.logo span{color:#b2a5ff}.nav{padding:12px 14px;border-radius:9px;color:#e2e8f5;font-size:14px;margin-bottom:7px}.nav.active{background:#2b354c}.sidebottom{font-size:12px;color:#9ba7be;margin:35px 14px}.main{flex:1;min-width:0;padding:42px clamp(20px,5vw,72px)}h1{font-size:31px;letter-spacing:-1.2px;margin:0 0 6px}h2{font-size:18px;margin:0 0 20px}p.muted,.muted{color:#7b8497}p.muted{margin-top:3px;font-size:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.btn{background:#5549d9;color:#fff;border:0;border-radius:9px;padding:11px 17px;font-weight:650;font-size:13px}.btn:hover{filter:brightness(.95)}.btn.ghost{background:#fff;color:#354157;border:1px solid #dfe3ea}.btn.bad{background:#fff0ed;color:#a63e28}.btn:disabled{opacity:.6;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:30px}.card,.panel{background:white;border:1px solid #ebedf2;border-radius:13px;box-shadow:0 2px 8px #10182805}.card{padding:21px}.card strong{font-size:29px;display:block;letter-spacing:-.7px;margin-top:14px}.card small{color:#7b8497}.panel{padding:26px;margin-bottom:22px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panelhead h2{margin:0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#97a0af;font-weight:750}td,th{padding:17px 11px;border-bottom:1px solid #eef0f4}tr:last-child td{border:0}td{font-size:13px}.pill{display:inline-block;border-radius:30px;background:#f0f1f6;padding:5px 10px;font-size:11px;font-weight:700;color:#6a7182}.pill.approved{background:#e9f7ef;color:#23754d}.pill.pending{background:#fff5df;color:#a77519}.pill.changes{background:#fff0ed;color:#b04733}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:19px}label{font-size:12px;font-weight:700;display:block;margin-bottom:7px;color:#49546a}input,textarea,select{width:100%;border:1px solid #dce1eb;border-radius:8px;padding:11px 12px;background:#fff;font-size:14px;outline:0}input:focus,textarea:focus,select:focus{border-color:#675cde;box-shadow:0 0 0 3px #6a60ec15}textarea{resize:vertical;min-height:104px}.field{margin-bottom:17px}.modal-back{position:fixed;inset:0;background:#10182877;display:flex;align-items:center;justify-content:center;padding:20px;z-index:4}.modal{width:min(570px,100%);max-height:92vh;overflow-y:auto;padding:27px;background:white;border-radius:16px;box-shadow:0 20px 60px #10182833}.modal .head{margin-bottom:20px}.close{background:transparent;border:0;font-size:26px;color:#667085}.login{width:min(420px,90vw);margin:10vh auto}.login h1{margin-bottom:12px}.login .panel{padding:32px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;z-index:9;background:#202a3e;color:white;padding:14px 20px;border-radius:9px;max-width:420px;box-shadow:0 6px 25px #0002}.portal{max-width:1050px;margin:0 auto;padding:36px 20px 75px}.portaltop{display:flex;justify-content:space-between;align-items:center;padding-bottom:35px}.reviewcard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,1fr);gap:27px;background:white;border:1px solid #e9edf3;border-radius:16px;padding:23px;margin-bottom:20px}.reviewcard video{width:100%;max-height:460px;object-fit:contain;background:#151923;border-radius:10px}.reviewcard h2{font-size:20px;margin-bottom:9px}.reviewcard .caption{white-space:pre-wrap;line-height:1.6;font-size:14px;color:#455166;max-height:240px;overflow-y:auto}.reviewactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.empty{padding:30px;text-align:center;color:#8b96a8}.micro{font-size:12px;color:#98a2b3}.nowrap{white-space:nowrap}@media(max-width:850px){.sidebar{display:none}.main{padding:25px 17px}.cards{grid-template-columns:repeat(2,1fr)}.reviewcard{grid-template-columns:1fr}.head{align-items:flex-start}.grid2{grid-template-columns:1fr}.portal{padding-top:20px}}@media(max-width:450px){.cards{grid-template-columns:1fr 1fr}.card{padding:14px}.card strong{font-size:24px}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div><script>
const app=document.querySelector('#app');const query=new URLSearchParams(location.search);const clientToken=query.get('client');let clients=[],posts=[];
const e=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmt=s=>s?new Date(s).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'Not set';const status=s=>({pending:'Awaiting approval',approved:'Approved',changes:'Changes requested'})[s]||s;
function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4200)}
async function api(url,opt={}){let r=await fetch(url,opt);let out=await r.json().catch(()=>({}));if(!r.ok)throw Error(out.detail||'Something went wrong');return out}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function go(){if(clientToken)renderPortal();else renderAdmin()}
async function renderAdmin(){let session=await api('/api/session');if(!session.admin){app.innerHTML=`<div class="login"><div class="panel"><div class="logo" style="color:#212b40;margin:0 0 24px">Content<span>Flow</span></div><h1>Welcome back</h1><p class="muted">Sign in to your content workspace.</p><form id="login" style="margin-top:26px"><div class="field"><label>Admin password</label><input type="password" id="password" required autofocus></div><button class="btn" style="width:100%">Sign in</button></form></div></div>`;document.querySelector('#login').onsubmit=async ev=>{ev.preventDefault();try{await fetch('/api/login',json('POST',{password:document.querySelector('#password').value})).then(r=>{if(!r.ok)throw Error('Incorrect password')});renderAdmin()}catch(err){toast(err.message)}};return}
try{[clients,posts]=await Promise.all([api('/api/clients'),api('/api/posts')])}catch(err){toast(err.message);return}
let awaiting=posts.filter(p=>p.status==='pending').length,approved=posts.filter(p=>p.status==='approved').length,changes=posts.filter(p=>p.status==='changes').length;
app.innerHTML=`<div class="layout"><aside class="sidebar"><div class="logo">Content<span>Flow</span></div><div class="nav active">▦ &nbsp; Overview</div><div class="nav">▤ &nbsp; Content review</div><div class="nav">▦ &nbsp; Clients</div><div class="sidebottom">The simple way to get content approved.<br><br><button class="btn ghost" id="logout">Log out</button></div></aside><main class="main"><div class="head"><div><h1>Workspace overview</h1><p class="muted">Manage content, clients and approvals from one place.</p></div><button class="btn" id="newPost">+ New content</button></div><div class="cards"><div class="card"><small>Total content</small><strong>${posts.length}</strong></div><div class="card"><small>Awaiting review</small><strong>${awaiting}</strong></div><div class="card"><small>Approved</small><strong>${approved}</strong></div><div class="card"><small>Needs changes</small><strong>${changes}</strong></div></div><section class="panel"><div class="panelhead"><h2>Content pipeline</h2><span class="micro">Your latest submissions</span></div><div class="tablewrap"><table><thead><tr><th>Content</th><th>Client</th><th>Publish plan</th><th>Status</th><th>Actions</th></tr></thead><tbody>${posts.length?posts.map(p=>`<tr><td><b>${e(p.title)}</b><div class="micro">${e(p.original_filename||'No video attached')}</div></td><td>${e(p.client_name)}</td><td>${e(fmt(p.publish_at))}</td><td><span class="pill ${e(p.status)}">${e(status(p.status))}</span></td><td><button class="btn ghost" data-copy="${e(p.client_token)}" data-post="${p.id}">Copy review link</button> ${p.status!=='pending'?`<button class="btn ghost" data-resubmit="${p.id}">Resubmit</button>`:''}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">No content yet. Create a client, then upload your first reel.</td></tr>`}</tbody></table></div></section><section class="panel"><div class="panelhead"><h2>Clients</h2><button class="btn ghost" id="newClient">+ Add client</button></div><div class="tablewrap"><table><thead><tr><th>Client</th><th>Email</th><th>Portal</th></tr></thead><tbody>${clients.length?clients.map(c=>`<tr><td><b>${e(c.name)}</b></td><td>${e(c.email||'No email set')}</td><td><button class="btn ghost" data-copy="${e(c.token)}">Copy portal link</button></td></tr>`).join(''):`<tr><td colspan="3" class="empty">No clients added yet.</td></tr>`}</tbody></table></div></section><p class="micro">Publishing integration is not enabled in this MVP. Approved content is marked ready for your publishing workflow.</p></main></div>`;
document.querySelector('#newClient').onclick=clientModal;document.querySelector('#newPost').onclick=postModal;document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});go()};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{let url=location.origin+'/?client='+b.dataset.copy+(b.dataset.post?'&post='+b.dataset.post:'');try{await navigator.clipboard.writeText(url);toast('Review link copied')}catch{prompt('Copy this link',url)}});document.querySelectorAll('[data-resubmit]').forEach(b=>b.onclick=async()=>{if(!confirm('Send this item back for client review?'))return;try{await api('/api/posts/'+b.dataset.resubmit+'/resubmit',{method:'POST'});toast('Sent for review');go()}catch(err){toast(err.message)}})
}
function modal(html){let el=document.createElement('div');el.className='modal-back';el.innerHTML=`<div class="modal">${html}</div>`;document.body.append(el);el.onclick=ev=>{if(ev.target===el||ev.target.closest('.close'))el.remove()};return el}
function clientModal(){let m=modal(`<div class="head"><h2>Add client</h2><button class="close">×</button></div><form id="clientForm"><div class="field"><label>Client or studio name</label><input name="name" required maxlength="100" placeholder="Example: Studio North"></div><div class="field"><label>Email for review notifications (optional)</label><input name="email" type="email" placeholder="client@example.com"></div><button class="btn">Create client</button></form>`);m.querySelector('form').onsubmit=async ev=>{ev.preventDefault();let f=new FormData(ev.target);try{await api('/api/clients',json('POST',Object.fromEntries(f)));m.remove();toast('Client created');go()}catch(err){toast(err.message)}}}
function postModal(){if(!clients.length){toast('Create a client first');return}let m=modal(`<div class="head"><h2>Submit new content</h2><button class="close">×</button></div><form id="postForm"><div class="field"><label>Client</label><select name="client_id" required>${clients.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('')}</select></div><div class="field"><label>Reel title</label><input name="title" required maxlength="200" placeholder="Office reveal reel"></div><div class="field"><label>Video — MP4, MOV or WEBM (optional)</label><input name="video" type="file" accept=".mp4,.mov,.webm,.m4v,video/*"></div><div class="field"><label>Proposed caption</label><textarea name="caption" placeholder="Write your suggested caption..."></textarea></div><div class="field"><label>Proposed publish date (optional)</label><input name="publish_at" type="datetime-local"></div><p class="micro">After submission, copy the review link to send it to your client. Email notifications require SMTP configuration.</p><button class="btn" id="uploadBtn">Send for approval</button></form>`);m.querySelector('form').onsubmit=async ev=>{ev.preventDefault();let b=m.querySelector('#uploadBtn');b.disabled=true;b.textContent='Uploading...';try{let payload=new FormData(ev.target);if(!payload.get('video')?.size)payload.delete('video');let result=await api('/api/posts',{method:'POST',body:payload});m.remove();toast(result.notification==='sent'?'Submitted and client emailed':'Submitted! Copy the client review link.');go()}catch(err){toast(err.message);b.disabled=false;b.textContent='Send for approval'}}}
async function renderPortal(){try{let {client,posts:items}=await api('/api/portal/'+encodeURIComponent(clientToken));let focus=query.get('post');if(focus)items.sort((a,b)=>(a.id==focus?-1:b.id==focus?1:0));app.innerHTML=`<div class="portal"><div class="portaltop"><div class="logo" style="color:#212b40;margin:0">Content<span>Flow</span></div><span class="micro">Client review portal</span></div><h1>${e(client.name)} — Content review</h1><p class="muted" style="margin-bottom:35px">Preview content, approve it or request changes. Your feedback goes directly to your content manager.</p>${items.length?items.map(p=>`<article class="reviewcard" id="post-${p.id}"><div>${p.filename?`<video controls preload="metadata" src="/api/video/${p.id}?token=${encodeURIComponent(clientToken)}"></video>`:`<div class="empty" style="background:#f5f6f9;border-radius:10px">No video uploaded</div>`}</div><div><span class="pill ${e(p.status)}">${e(status(p.status))}</span><h2 style="margin-top:18px">${e(p.title)}</h2><p class="micro">Proposed publishing: ${e(fmt(p.publish_at))}</p><label style="margin-top:22px">Proposed caption</label><div class="caption">${e(p.caption||'No caption provided')}</div>${p.status==='pending'?`<div class="reviewactions"><button class="btn" data-approve="${p.id}">✓ Approve content</button><button class="btn ghost" data-changes="${p.id}">Request changes</button></div>`:p.status==='changes'?`<p class="muted"><b>Your feedback:</b> ${e(p.feedback)}</p>`:`<p class="muted">Thank you — this item is approved. Your content manager will handle publishing.</p>`}</div></article>`).join(''):`<div class="panel empty">No content to review yet.</div>`}<p class="micro">This is a private link. Please do not share it with anyone outside your team.</p></div>`;
document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{if(!confirm('Approve this content for publishing?'))return;try{await api(`/api/portal/${encodeURIComponent(clientToken)}/posts/${b.dataset.approve}/decision`,json('POST',{action:'approve'}));toast('Content approved');go()}catch(err){toast(err.message)}});document.querySelectorAll('[data-changes]').forEach(b=>b.onclick=()=>{let id=b.dataset.changes;let m=modal(`<div class="head"><h2>Request changes</h2><button class="close">×</button></div><form><div class="field"><label>What should be changed?</label><textarea required maxlength="2000" name="feedback" placeholder="Example: Please replace the first shot and shorten the ending."></textarea></div><button class="btn bad">Send feedback</button></form>`);m.querySelector('form').onsubmit=async ev=>{ev.preventDefault();try{await api(`/api/portal/${encodeURIComponent(clientToken)}/posts/${id}/decision`,json('POST',{action:'changes',feedback:new FormData(ev.target).get('feedback')}));m.remove();toast('Feedback sent');go()}catch(err){toast(err.message)}}})}catch(err){app.innerHTML=`<div class="login panel"><h2>Portal unavailable</h2><p>${e(err.message)}</p></div>`}}
go();
</script>
<script>
const appRoot = document.querySelector('#app');
const navObserver = new MutationObserver(() => {
	appRoot.querySelectorAll('.sidebar .nav:not([data-nav-ready])').forEach((item) => {
		item.dataset.navReady = 'true';
		item.setAttribute('role', 'button');
		item.tabIndex = 0;
	});
});
navObserver.observe(appRoot, { childList: true, subtree: true });

function navigateAdmin(item) {
	const label = item.textContent.trim();
	const panels = document.querySelectorAll('.main > .panel');
	const target = label.includes('Content review')
		? panels[0]
		: label.includes('Clients')
			? panels[1]
			: document.querySelector('.main');
	if (!target) return;
	document.querySelectorAll('.sidebar .nav').forEach((nav) => {
		nav.classList.toggle('active', nav === item);
	});
	target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('click', (event) => {
	const item = event.target.closest('.sidebar .nav');
	if (item) navigateAdmin(item);
});

document.addEventListener('keydown', (event) => {
	const item = event.target.closest('.sidebar .nav');
	if (item && (event.key === 'Enter' || event.key === ' ')) {
		event.preventDefault();
		navigateAdmin(item);
	}
});
</script>
<script src="/static/admin.js" defer></script>
</body></html>
